const PAGES=[
 {title:'Welcome to the crew',label:'A 35–45 minute class review',html:`<div class="cover"><div><span class="ribbon">UNITS 1 + 2</span><h1>Grammar.<br>Action.<br>Adventure!</h1><p class="lead">What have we done?<br>What have we been doing?</p><p>Five tenses. Two big missions.<br>One brilliant grammar crew.</p></div><img src="${ART}" alt="Cartoon children helping at a zoo"></div>`,note:'Suggested flow: pages 1–5 warm-up (7 min); 6–13 perfect forms and contrasts (13 min); 14–16 team practice (10 min); 17–19 speaking, writing and exit check (10 min). Ask learners to explain choices before revealing. Full screen works where the browser permits it. This file needs no internet, fonts, audio service or installation.'},
 {title:'Five ways to tell the story',label:'Meaning first',html:`<h2>What do you mean?</h2><p class="lead">Choose the message before choosing the verb.</p><div class="timeline"><div class="time" style="background:var(--yellow)"><h3>Simple present</h3><strong>Facts & routines</strong><p>every day<br>usually</p></div><div class="time" style="background:var(--teal)"><h3>Present continuous</h3><strong>Happening now</strong><p>now<br>at the moment</p></div><div class="time" style="background:var(--coral)"><h3>Simple past</h3><strong>A finished past time</strong><p>yesterday<br>last Saturday</p></div><div class="time" style="background:var(--purple)"><h3>Present perfect</h3><strong>Past connected to now</strong><p>experience<br>result / state</p></div><div class="time" style="background:var(--green)"><h3>Present perfect continuous</h3><strong>Activity until now</strong><p>process<br>how long</p></div></div>`,note:'Ask the class to mime “every day”, “right now” and “yesterday”. Explain that time words are clues, not a mechanical tense detector. Both perfect forms connect earlier events or activities to now.'},
 {title:'Every day at the zoo',label:'Simple present',html:`<h2>A routine? Keep it simple.</h2><div class="two"><div><div class="formula">I / you / we / they + base verb<br>He / she / it + verb-s</div><div class="example">Ruby <b>feeds</b> the penguins every morning.</div><p>She <b>doesn’t feed</b> them at night.<br><b>Does</b> she <b>feed</b> them? Yes, she does.</p></div><div class="box yellow"><h3>Your turn</h3><p>Leo / clean the picnic area / every Saturday</p>${rev('Reveal a model','Leo cleans the picnic area every Saturday.')}<p class="muted">Change it into a negative. Then ask a question.</p></div></div>`,note:'Elicit cleans, doesn’t clean, Does Leo clean…? Highlight that the -s moves into does in questions and negatives. Contrast “Pandas eat bamboo” as a fact, not only a routine.'},
 {title:'Look at the volunteers!',label:'Present continuous',html:`<h2>What is happening now?</h2><div class="formula">am / is / are + verb-ing</div><div class="example">They <b>are planting</b> trees right now.</div><div class="two"><div><p>They <b>aren’t taking</b> photos.<br><b>Are</b> they <b>working</b>? Yes, they are.</p></div><div class="box teal"><h3>Act it out!</h3><p>One person mimes an action. Everyone asks a question.</p>${rev('Reveal examples','Are you cleaning the cage?<br>Are you feeding the animals?')}</div></div>`,note:'Use 30 seconds of mime. Listen for missing be: “you feeding” is incomplete. Temporary situations can also use present continuous, but this review focuses on happening now.'},
 {title:'Yesterday’s mission',label:'Simple past',html:`<h2>A finished time in the past.</h2><div class="example">Yesterday, we <b>collected</b> ten bags of litter.<br>Ruby <b>took</b> some photos.</div><div class="two"><div><div class="formula">past form<br>didn’t + base verb<br>Did + subject + base verb?</div><p>Did she <b>take</b> photos?<br>Yes, she did.</p></div><div class="box coral"><h3>Repair the speech!</h3><p>“Did she took photos yesterday?”</p>${rev('Show the repair','Did she <b>take</b> photos yesterday?<br>After did, use the base verb.')}</div></div>`,note:'Ask learners to name finished past times, e.g. yesterday, last year, in 2020. Give two more irregular verbs orally: go/went, write/wrote. Do not imply that every past-tense sentence needs a written time phrase.'},
 {title:'Past connected to now',label:'Present perfect',html:`<h2>What has happened up to now?</h2><div class="formula">have / has + past participle</div><div class="row"><span>Experience</span><b>I have seen a panda.</b></div><div class="row"><span>Result / total</span><b>We have made ten posters.</b></div><div class="row"><span>State until now</span><b>She has been a member for two years.</b></div><p class="muted">We do not name a finished past time for these present-perfect meanings.</p>${rev('Compare with yesterday','I <b>saw</b> a panda yesterday.<br>NOT: I have seen a panda yesterday.')}`,note:'Have learners explain what each sentence tells us now. Experience: it is part of my life. Result: ten posters are available. State: she is still a member. Do not teach “present perfect always means finished”.'},
 {title:'Still busy!',label:'Present perfect continuous',html:`<h2>How long has this been going on?</h2><div class="formula">have / has + been + verb-ing</div><div class="timelineLine"><span>Started at 9:00</span><span class="ongoing">cleaning… cleaning…</span><span>NOW 11:00</span></div><div class="example">We <b>have been cleaning</b> for two hours.<br>We are still cleaning.</div><p>Focus on the <b>activity</b> and its <b>duration</b>.</p>${rev('Ask the question','How long <b>have you been cleaning</b>?')}`,note:'Make a continuous arm movement from nine to now. Students should hear the three-part verb chunk have + been + cleaning. Extension only: it can also describe a recently stopped activity with a visible effect, e.g. “I’m muddy because I’ve been gardening.”'},
 {title:'Result or process?',label:'The perfect-form spotlight',html:`<h2>What are you focusing on?</h2><div class="two"><div class="box purple"><h3>The completed total</h3><div class="example">We <b>have made</b> ten posters.</div><p>How many are finished?<br>Ten!</p></div><div class="box green"><h3>The activity until now</h3><div class="example">We <b>have been making</b> posters for an hour.</div><p>How long have we been busy?<br>An hour!</p></div></div>${rev('A useful exception','“I have worked here for years” and “I have been working here for years” can <b>both</b> be correct. The continuous puts more emphasis on the activity.')}`,note:'This is a contrast in focus, not a universal finished/unfinished rule. Ask students to choose what they would say to report a total and what they would say to explain how they spent the morning.'},
 {title:'For or since?',label:'Duration vs starting point',html:`<h2>How long? From when?</h2><div class="two"><div class="box yellow"><h3>FOR + a period of time</h3><p>for ten minutes<br>for three weeks<br>for five years</p></div><div class="box teal"><h3>SINCE + a starting point</h3><p>since nine o’clock<br>since Monday<br>since 2022</p></div></div><div style="margin-top:23px">${quiz('for1','We have been helping ___ two hours.',['for','since'],0,'Two hours is a duration, so use <b>for</b>.')}${quiz('for2','She has been a member ___ September.',['for','since'],1,'September is the starting point, so use <b>since</b>.')}</div>`,note:'After each choice, require a spoken reason. Then ask for a new example with the other time phrase. Both present perfect and present perfect continuous can use for/since.'},
 {title:'The auxiliary does the work',label:'Questions, negatives and short answers',html:`<h2>Find the helper verb.</h2><table class="table"><thead><tr><th>Statement</th><th>Negative</th><th>Question → short answer</th></tr></thead><tbody><tr><td>She works.</td><td>She <b>doesn’t</b> work.</td><td><b>Does</b> she work? → Yes, she <b>does</b>.</td></tr><tr><td>She is working.</td><td>She <b>isn’t</b> working.</td><td><b>Is</b> she working? → Yes, she <b>is</b>.</td></tr><tr><td>She worked.</td><td>She <b>didn’t</b> work.</td><td><b>Did</b> she work? → Yes, she <b>did</b>.</td></tr><tr><td>She has worked.</td><td>She <b>hasn’t</b> worked.</td><td><b>Has</b> she worked? → Yes, she <b>has</b>.</td></tr><tr><td>She has been working.</td><td>She <b>hasn’t</b> been working.</td><td><b>Has</b> she been working? → Yes, she <b>has</b>.</td></tr></tbody></table>`,note:'Quick call-and-response: say a question, learners give positive and negative short answers. Include Have you been helping? Yes, I have / No, I haven’t. Contractions are welcome. This table uses action verbs; be as the main verb has its own simple-present and simple-past question patterns.'},
 {title:'The irregular toolbox',label:'Base → past → past participle',html:`<h2>Not all verbs add -ed.</h2><table class="table"><tr><th>Base</th><th>Simple past</th><th>Past participle</th></tr><tr><td>see</td><td>saw</td><td>seen</td></tr><tr><td>go</td><td>went</td><td>gone</td></tr><tr><td>take</td><td>took</td><td>taken</td></tr><tr><td>write</td><td>wrote</td><td>written</td></tr><tr><td>feed</td><td>fed</td><td>fed</td></tr><tr><td>do</td><td>did</td><td>done</td></tr><tr><td>be</td><td>was / were</td><td>been</td></tr></table>${rev('Finish two sentences','Yesterday, I <b>took</b> photos.<br>I have <b>taken</b> lots of photos in my life.')}`,note:'Cover the final column with your hand or ask learners to close their eyes and recall. Elicit two more triples from the source topics: sell/sold/sold and eat/ate/eaten. Gone means someone has gone away; been can describe a visit and return.'},
 {title:'One verb, five meanings',label:'The verb clean',html:`<h2>Same action. Different message.</h2><div class="row"><span>I <b>clean</b> the pool every week.</span><span class="tiny">routine</span></div><div class="row"><span>I <b>am cleaning</b> the pool now.</span><span class="tiny">right now</span></div><div class="row"><span>I <b>cleaned</b> the pool yesterday.</span><span class="tiny">finished past time</span></div><div class="row"><span>I <b>have cleaned</b> three pools today.</span><span class="tiny">total up to now</span></div><div class="row"><span>I <b>have been cleaning</b> for two hours.</span><span class="tiny">activity until now</span></div>`,note:'For the fourth sentence, establish that today is not over. Ask learners to choose a new verb and create two contrasting sentences, e.g. write, paint or collect. The fifth sentence does not by itself prove the activity is unfinished; here we are using the continuing scenario.'},
 {title:'Been is not always continuous',label:'A state or an activity?',html:`<h2>Look after “been”.</h2><div class="two"><div class="box purple"><h3>Present perfect</h3><p>I <b>have been a member</b> for two years.</p><p class="muted">A state: I am still a member.<br>No -ing action verb here.</p></div><div class="box green"><h3>Present perfect continuous</h3><p>I <b>have been helping</b> for two hours.</p><p class="muted">An activity: helping.<br>Been + -ing.</p></div></div><div class="example">I <b>have known</b> her for years.<br><span class="muted">We normally do not say “have been knowing”.</span></div>`,note:'This is a crucial checkpoint. Ask which sentence contains been + an -ing action. Other state examples: have had a bike, have liked animals. Avoid the inaccurate rule “for/since always requires the continuous”.'},
 {title:'Time detective',label:'Team challenge 1',html:`<h2>Find the best report.</h2>${quiz('d1','The keepers finished the job last night.',['They have finished it last night.','They finished it last night.'],1,'<b>Last night</b> is a finished past time. Use finished.')}${quiz('d2','The team is still painting. Focus on how long.',['They have been painting for an hour.','They have painted ten finished posters.'],0,'The first sentence describes the continuing activity and its duration. The second describes a completed total.')}${quiz('d3','Ask about an experience, with no finished time.',['Have you ever seen a wild giraffe?','Did you ever saw a wild giraffe?'],0,'<b>Have + subject + past participle</b> asks about experience. After did, the verb would need to be see.')}`,note:'Teams earn one point for the correct answer and a second point for explaining the meaning or form. Ask them to correct the wrong option when possible.'},
 {title:'Comic repair',label:'Team challenge 2',html:`<h2>Fix the broken speech.</h2><div class="two"><div><div class="example">“She have saw a panda.”</div>${rev('Reveal repair 1','She <b>has seen</b> a panda.')}<div class="example">“Did he worked here?”</div>${rev('Reveal repair 2','Did he <b>work</b> here?')}</div><div><div class="example">“We have been help since two hours.”</div>${rev('Reveal repair 3','We have been <b>helping for</b> two hours.')}<p class="muted">More than one thing may need fixing. Explain each change.</p></div></div>`,note:'Give pairs 45 seconds before revealing. Sentence 1: has matches she; seen is the past participle. Sentence 2: base verb after did. Sentence 3: been + -ing; for + duration.'},
 {title:'Sentence studio',label:'Team challenge 3',html:`<h2>Build the question.</h2><p>Ask about an activity continuing until now.</p><div id="builderSlot" class="slot"></div><div id="builderPool" class="chips"></div><div class="options"><button id="buildCheck">Check the question</button><button id="buildReset">Start again</button></div><div id="buildFeedback" class="feedback hidden"></div>`,note:'Target: How long have you been working here? Ask learners to answer truthfully using a different activity: I have been learning English for… The word order question is controlled practice, not free-writing assessment.',builder:true},
 {title:'Interview your partner',label:'Use it in conversation',html:`<h2>Ask. Listen. Follow up.</h2><div class="two"><div class="box purple"><h3>Life experience</h3><p>Have you ever … ?<br>Yes, I have. / No, I haven’t.</p><p>Follow-up:<br>When did you … ?</p>${rev('Reveal a mini-dialogue','A: Have you ever visited a zoo?<br>B: Yes, I have.<br>A: When did you visit?<br>B: I visited last summer.')}</div><div class="box green"><h3>An activity until now</h3><p>What have you been … ?<br>How long have you been … ?</p>${rev('Reveal a model','A: How long have you been learning English?<br>B: I’ve been learning English for five years.')}</div></div>`,note:'Allow two minutes per partner. Listen for meaningful follow-up, the correct auxiliary in short answers, and base forms after did. Students should use their real answers; no need to claim experiences they have not had.'},
 {title:'Write a mission report',label:'From knowing to using',html:`<h2>Four sentences. One story.</h2><p class="lead">Imagine you volunteer at a zoo or help protect your neighbourhood.</p><div class="two"><div class="box yellow"><p>1. Your usual job<br>2. What you are doing now<br>3. A job you finished yesterday<br>4. An activity you started earlier and are still doing</p><p class="muted">Underline each verb group. Explain the tense you chose.</p></div><div><p class="prompt">Write first. Then compare.</p>${rev('Reveal a sample report','I <b>help</b> at the zoo every Saturday.<br>Today, I <b>am cleaning</b> the picnic area.<br>Yesterday, I <b>fed</b> the penguins.<br>I <b>have been working</b> since nine o’clock.')}<p class="muted">Extra challenge: add a completed total using the present perfect.</p></div></div>`,note:'Allow three minutes. Give feedback on one meaning choice and one form, rather than correcting every word. Bonus model: “I have collected ten bottles so far.” This task gives evidence of use beyond selecting answers.'},
 {title:'Exit ticket',label:'Show what you can do',html:`<h2>Your final five.</h2><p class="muted">Write the missing verb group before revealing the answers.</p><p>1. Every morning, she ___ the animals. (feed)</p><p>2. Look! They ___ trees. (plant)</p><p>3. Yesterday, I ___ some photos. (take)</p><p>4. I ___ a panda before. (see)</p><p>5. We are still busy. We ___ for two hours. (work)<br><span class="muted">Focus on the continuing activity.</span></p>${rev('Reveal and explain','1. <b>feeds</b> · routine<br>2. <b>are planting</b> · happening now<br>3. <b>took</b> · finished past time<br>4. <b>have seen</b> · experience<br>5. <b>have been working</b> · activity until now<br><small>“Have worked” can also be grammatical; “have been working” best matches the requested focus.</small>')}`,note:'Collect responses before revealing. Look at the pattern of mistakes, not just a total score. Follow-up: use the matching mobile game mission. The offline review does not record individual results.'}
];
let page=0,points=[0,0];const slide=document.querySelector('#slide');
function show(n){page=Math.max(0,Math.min(n,PAGES.length-1));const p=PAGES[page];slide.innerHTML=`<div class="kicker">${p.label}</div>${p.html}`;document.querySelector('#teacher').textContent=p.note;document.querySelector('#count').textContent=`${page+1} / ${PAGES.length}`;document.querySelector('#jump').value=String(page);document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===PAGES.length-1;slide.querySelectorAll('.revealbtn').forEach(b=>b.onclick=()=>{const x=b.nextElementSibling;x.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!x.classList.contains('hidden')));});slide.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const group=b.closest('.mini'),answer=Number(group.dataset.answer);group.querySelectorAll('button').forEach(x=>{x.disabled=true;if(Number(x.dataset.i)===answer)x.classList.add('correct');});if(Number(b.dataset.i)!==answer)b.classList.add('wrong');group.querySelector('.feedback').classList.remove('hidden');});if(p.builder)initBuilder();window.scrollTo(0,0);}
const j=document.querySelector('#jump');j.innerHTML=PAGES.map((p,i)=>`<option value="${i}">${i+1}. ${p.title}</option>`).join('');j.onchange=()=>show(Number(j.value));document.querySelector('#prev').onclick=()=>show(page-1);document.querySelector('#next').onclick=()=>show(page+1);document.querySelector('#full').onclick=()=>{try{if(document.fullscreenElement){document.exitFullscreen?.();}else{const p=document.documentElement.requestFullscreen?.();p?.catch(()=>alert('Full screen is not available. You can still use the review normally.'));}}catch(e){alert('Full screen is not available in this browser.');}};document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(page+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(page-1);}});document.querySelector('#a').onclick=()=>document.querySelector('#av').textContent=++points[0];document.querySelector('#b').onclick=()=>document.querySelector('#bv').textContent=++points[1];document.querySelector('#reset').onclick=()=>{points=[0,0];document.querySelector('#av').textContent=0;document.querySelector('#bv').textContent=0;};
function initBuilder(){const words=['working','How','been','here?','you','long','have'];let selected=[];function draw(){document.querySelector('#builderSlot').innerHTML=selected.map(i=>`<button data-remove="${i}">${words[i]}</button>`).join('');document.querySelector('#builderPool').innerHTML=words.map((w,i)=>selected.includes(i)?'':`<button data-add="${i}">${w}</button>`).join('');slide.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{selected.push(Number(b.dataset.add));draw();});slide.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected=selected.filter(i=>i!==Number(b.dataset.remove));draw();});document.querySelector('#buildFeedback').classList.add('hidden');}draw();document.querySelector('#buildReset').onclick=()=>{selected=[];draw();};document.querySelector('#buildCheck').onclick=()=>{const correct=selected.map(i=>words[i]).join(' ')==='How long have you been working here?';const f=document.querySelector('#buildFeedback');f.classList.remove('hidden');f.textContent=correct?'Exactly! How long + have + subject + been + -ing.':'Try again: start with How long. Then choose the helper verb, the subject, been, the action and the place.';};}
const DISCUSSION_MATCHES={"1": {"title": "What do you mean?", "intro": "Choose the message before choosing the verb. Match each example to one of the five types.", "categories": [["Simple present", "Facts & routines · every day / usually"], ["Present continuous", "Happening now · now / at the moment"], ["Simple past", "A finished past time · yesterday / last Saturday"], ["Present perfect", "Past connected to now · experience / result / state"], ["Present perfect continuous", "Activity until now · process / how long"]], "examples": [["Yesterday, we cleaned the cages.", 2, "Yesterday is a finished past time, so cleaned is simple past."], ["We have fed three giraffes so far.", 3, "The completed total up to now is the focus: have + past participle."], ["My friend checks the animals every morning.", 0, "Every morning describes a routine. One friend takes checks."], ["We have been preparing food for an hour, and we are still busy.", 4, "The continuing activity and its duration are the focus: have been + -ing."], ["Look! The volunteers are carrying leaves.", 1, "Look points to an action happening now: are + -ing."]]}, "5": {"title": "What has happened up to now?", "intro": "One form, three messages. Discuss which message each sentence communicates.", "categories": [["Experience", "Something someone has or hasn’t done in life up to now"], ["Result / total", "What is completed or how much has been done up to now"], ["State until now", "A state that began earlier and still continues"]], "examples": [["We have made ten posters.", 1, "Ten posters tells us the completed total. The focus is the result."], ["She has been a member for two years.", 2, "She became a member two years ago and is still a member. Been is the past participle of be; this is not a continuous form."], ["I have seen a panda.", 0, "This tells us about a life experience without naming a finished past time."]], "rule": "have / has + past participle"}};
const DISCUSSION_PROMPTS=["", "Which meaning and time clue fits each example?", "What tells us this is a routine? What changes with he or she?", "How do we show an action happening right now?", "Why does yesterday change the verb form?", "Is each message an experience, a result, or a continuing state?", "Which words show an action started earlier and is still continuing?", "Are we focusing on a completed result or the continuing process?", "Is this phrase a duration or a starting point?", "Which helper comes first in a question? What happens to the main verb?", "Which form is the simple past, and which is the past participle?", "How does the meaning change when we change the verb group?", "Is been followed by a noun, an adjective, or an -ing verb?", "What message and time clue should guide our choice?", "What is wrong? Explain the reason before revealing the repair.", "What should come first? Build the sentence together before checking.", "What question could help us learn about this person?", "How can these grammar forms tell one connected report?", "Choose the verb group and explain the meaning before revealing."];
/* Teacher-led discussion and individual reveals, all available offline. */
const discussionEscape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let discussionRecords={};let discussionMatches={};
function matchLesson(config){return `<h2>${config.title}</h2><p>${config.intro}</p><div class="meaning-categories">${config.categories.map((c,i)=>`<button data-category="${i}" class="category-${i}"><b>${discussionEscape(c[0])}</b><span>${discussionEscape(c[1])}</span></button>`).join('')}</div><p class="muted">1. Tap an example. 2. Choose its category above. 3. Discuss your reason. Reveal each answer when the class is ready.</p><div id="meaning-examples">${config.examples.map((e,i)=>`<article class="meaning-example" data-example-row="${i}"><button class="choose-example" data-example="${i}" aria-pressed="false">${discussionEscape(e[0])}</button><div class="meaning-choice" id="meaning-choice-${i}">Our match: not chosen yet</div><button class="meaning-reveal" data-meaning-reveal="${i}">Reveal after discussion</button><div class="meaning-answer" id="meaning-answer-${i}" hidden></div></article>`).join('')}</div>${config.rule?`<div class="formula">${config.rule}</div>`:''}${config.title==='What has happened up to now?'?'<p class="muted">We do not name a finished past time for these present-perfect meanings.</p>'+rev('Compare with yesterday','I <b>saw</b> a panda yesterday.<br>Use simple past with a finished past time, rather than I have seen a panda yesterday.') : ''}`;}
function bindMatchLesson(config){let active=null;const state=discussionMatches[page]??={guesses:{},revealed:{}};function refresh(){config.examples.forEach((e,i)=>{slide.querySelector('#meaning-choice-'+i).textContent='Our match: '+(state.guesses[i]===undefined?'not chosen yet':config.categories[state.guesses[i]][0]);slide.querySelector('[data-example="'+i+'"]').setAttribute('aria-pressed',String(active===i));const answer=slide.querySelector('#meaning-answer-'+i);answer.hidden=!state.revealed[i];if(state.revealed[i])answer.innerHTML='<b>'+discussionEscape(config.categories[e[1]][0])+'</b><p>'+discussionEscape(e[2])+'</p>';slide.querySelector('[data-meaning-reveal="'+i+'"]').textContent=state.revealed[i]?'Hide answer':'Reveal after discussion';});}slide.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.example);refresh();});slide.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{if(active===null){const hint=slide.querySelector('.match-alert');if(hint)hint.remove();const p=document.createElement('p');p.className='match-alert muted';p.textContent='Tap one of the example sentences first.';slide.querySelector('#meaning-examples').before(p);return;}if(state.revealed[active])return;state.guesses[active]=Number(b.dataset.category);refresh();});slide.querySelectorAll('[data-meaning-reveal]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.meaningReveal);if(!state.revealed[i]){const e=config.examples[i],guess=state.guesses[i];discussionRecords['match-'+page+'-'+i]??={skill:config.title,prompt:e[0],answer:config.categories[e[1]][0],guess:guess===undefined?'Discussed aloud — no on-screen choice':config.categories[guess][0],wrong:guess!==undefined&&guess!==e[1],why:e[2]};}state.revealed[i]=!state.revealed[i];refresh();});refresh();}
const originalDiscussionShow=show;
show=function(n){originalDiscussionShow(n);const config=DISCUSSION_MATCHES[page];if(config){slide.innerHTML='<div class="kicker">DISCUSS · MATCH · REVEAL</div>'+matchLesson(config);bindMatchLesson(config);}if(page){const prompt=document.createElement('p');prompt.className='discussion-prompt';prompt.textContent='Discuss first: '+DISCUSSION_PROMPTS[page];slide.querySelector('h2')?.after(prompt);slide.querySelectorAll('.formula, .example b, .row b, .table td:last-child').forEach((node,i)=>{if(node.closest('.model')||node.closest('#meaning-examples'))return;const rule=node.classList.contains('formula'),button=document.createElement('button'),wrap=document.createElement('span');wrap.className='discussion-cover';button.className='discussion-reveal';button.textContent=rule?'Reveal the grammar pattern':'Reveal '+(node.tagName==='TD'?'this example':'the missing words');button.setAttribute('aria-expanded','false');node.before(wrap);wrap.append(button,node);node.hidden=true;button.onclick=()=>{node.hidden=!node.hidden;button.setAttribute('aria-expanded',String(!node.hidden));button.textContent=node.hidden?(rule?'Reveal the grammar pattern':'Reveal the missing words'):'Hide again';};});const own=document.createElement('details');own.className='discussion-own';own.innerHTML='<summary>Now use it: our own example</summary><p>Make a new sentence using this page’s grammar. Explain why it fits. Ask a partner to change one detail or turn it into a question.</p><label><input type="checkbox"> We explained our choice and tried a new example.</label>';slide.append(own);}else{const p=document.createElement('p');p.className='discussion-prompt';p.textContent='Teacher-led review: discuss examples, match meanings, and reveal answers one at a time. Use the Class wrap-up button to revisit your choices.';slide.append(p);}slide.querySelectorAll('.revealbtn').forEach(b=>b.onclick=()=>{const x=b.nextElementSibling;x.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!x.classList.contains('hidden')));});if(config&&config.categories.length===5){let examplePage=0;const rows=[...slide.querySelectorAll('.meaning-example')],nav=document.createElement('div');nav.className='example-navigation';nav.innerHTML='<button id="exampleback">← Previous example</button><span id="examplecount"></span><button id="examplenext">Next example →</button>';slide.querySelector('#meaning-examples').after(nav);function showExample(){rows.forEach((r,i)=>r.hidden=i!==examplePage);rows[examplePage].querySelector('.choose-example').click();nav.querySelector('#examplecount').textContent='Example '+(examplePage+1)+' / '+rows.length;nav.querySelector('#exampleback').disabled=examplePage===0;nav.querySelector('#examplenext').disabled=examplePage===rows.length-1;}nav.querySelector('#exampleback').onclick=()=>{examplePage--;showExample();};nav.querySelector('#examplenext').onclick=()=>{examplePage++;showExample();};showExample();}bindDiscussionQuizzes();};
function bindDiscussionQuizzes(){slide.querySelectorAll('.mini').forEach((group,index)=>{const buttons=[...group.querySelectorAll('[data-q]')];if(!buttons.length)return;const feedback=group.querySelector('.feedback');let picked=null;buttons.forEach(b=>{b.onclick=()=>{picked=Number(b.dataset.i);buttons.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};});const reveal=document.createElement('button');reveal.className='discussion-reveal';reveal.textContent='Reveal and discuss';feedback.before(reveal);reveal.onclick=()=>{const answer=Number(group.dataset.answer);feedback.classList.remove('hidden');buttons.forEach(b=>{b.classList.toggle('correct',Number(b.dataset.i)===answer);b.classList.toggle('wrong',picked===Number(b.dataset.i)&&picked!==answer);b.disabled=true;});const model=buttons.find(b=>Number(b.dataset.i)===answer)?.textContent||'';discussionRecords['quiz-'+page+'-'+index]??={skill:PAGES[page].title,prompt:group.querySelector('.prompt')?.textContent||'',answer:model,guess:picked===null?'Discussed aloud — no on-screen choice':buttons.find(b=>Number(b.dataset.i)===picked)?.textContent||'',wrong:picked!==null&&picked!==answer,why:feedback.textContent};reveal.disabled=true;};});}
function openDiscussionWrapup(){const panel=document.querySelector('#discussion-summary-panel'),records=Object.values(discussionRecords),missed=records.filter(r=>r.wrong);panel.hidden=false;panel.innerHTML=`<h2>Our discussion wrap-up</h2><p>${records.length} examples revealed · ${missed.length} choices to revisit.</p>${(missed.length?missed:records).map(r=>`<article><h3>${discussionEscape(r.skill)}</h3><p>${discussionEscape(r.prompt)}</p><p>Our choice: ${discussionEscape(r.guess)}</p><p><b>Answer: ${discussionEscape(r.answer)}</b></p><p>${discussionEscape(r.why)}</p></article>`).join('')||'<p>Choose and reveal some examples first. Your discussion choices will appear here.</p>'}<p>Choose one example. Say the correct sentence, explain the grammar, then make a different example together.</p><button id="close-discussion-summary">Back to our lesson</button><button id="reset-discussion-summary">New class discussion</button>`;panel.querySelector('#close-discussion-summary').onclick=()=>{panel.hidden=true;slide.scrollIntoView();};panel.querySelector('#reset-discussion-summary').onclick=()=>{if(!confirm('Clear the recorded discussion choices for a new class?'))return;discussionRecords={};discussionMatches={};panel.hidden=true;show(page);};panel.scrollIntoView({behavior:'smooth',block:'start'});}
