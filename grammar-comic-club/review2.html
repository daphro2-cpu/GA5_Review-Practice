<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Comic Club • Review 1-2 • Offline</title><style>
:root{--ink:#24232b;--paper:#fff9eb;--yellow:#ffcf39;--teal:#70d2cb;--purple:#b69be1;--coral:#fa917d;--green:#bada85}*{box-sizing:border-box}body{margin:0;background:#eee7d8;color:var(--ink);font-family:'Century Gothic','Trebuchet MS',Arial,sans-serif}button,select{font:inherit}button{cursor:pointer;border:3px solid var(--ink);padding:10px 15px;background:white;border-radius:8px;box-shadow:3px 3px 0 var(--ink);font-weight:800;min-height:44px}button:active{transform:translate(2px,2px);box-shadow:none}button:disabled{opacity:.4;cursor:default}button:focus-visible,summary:focus-visible,select:focus-visible{outline:4px solid #345de5;outline-offset:3px}header{display:flex;justify-content:space-between;gap:12px;padding:13px 24px;background:white;border-bottom:3px solid var(--ink);align-items:center}header b{font-size:18px;letter-spacing:-.5px}header .tools{display:flex;gap:8px}header button{font-size:12px;min-height:36px;padding:6px 9px;box-shadow:2px 2px 0}main{max-width:1180px;margin:22px auto;padding:0 20px}.slide{background:var(--paper);min-height:630px;border:3px solid var(--ink);border-radius:10px;box-shadow:7px 7px 0 var(--ink);padding:42px 48px;position:relative;background-image:radial-gradient(#24232b12 .9px,transparent .9px);background-size:10px 10px}h1,h2,h3,p{margin-top:0}h1,h2{font-weight:1000;letter-spacing:-1.7px;line-height:1.04}h1{font-size:72px}h2{font-size:47px;margin-bottom:22px}h3{font-size:23px;line-height:1.2;margin-bottom:12px}p{font-size:21px;line-height:1.5;margin-bottom:18px}.kicker{font-size:13px;letter-spacing:1.4px;font-weight:900;text-transform:uppercase;margin-bottom:16px}.ribbon{display:inline-block;transform:rotate(-2deg);background:var(--yellow);padding:6px 11px;border:2px solid;font-size:13px;font-weight:900;margin-bottom:20px}.lead{font-size:25px;max-width:850px}.two{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}.cover{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.cover img{width:100%;border:3px solid;border-radius:30px 6px 30px 6px;box-shadow:5px 5px 0;transform:rotate(1.4deg)}.box{padding:22px;border:3px solid;border-radius:10px;background:white}.box.teal{background:var(--teal)}.box.purple{background:var(--purple)}.box.yellow{background:var(--yellow)}.box.coral{background:var(--coral)}.box.green{background:var(--green)}.example{font-size:27px;line-height:1.5;background:white;border:3px solid;border-radius:20px 20px 20px 3px;padding:23px;margin:15px 0;box-shadow:4px 4px 0}.example b,mark{background:var(--yellow);color:var(--ink);padding:1px 3px}.formula{font-weight:900;font-size:25px;padding:17px 0;border-bottom:2px solid;margin:5px 0 17px}.prompt{font-size:24px;font-weight:800;line-height:1.4}.muted{font-size:15px;line-height:1.6;color:#514b55}.reveal{margin:16px 0}.model{padding:18px;border:2px solid;background:#e5f3db;font-size:22px;line-height:1.6;margin-top:14px}.hidden{display:none!important}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:24px}.time{border:3px solid;padding:17px 13px;background:white;border-radius:7px}.time h3{font-size:18px;margin-bottom:15px}.time p{font-size:16px;line-height:1.4;margin-bottom:8px}.time strong{font-size:18px}.table{width:100%;border-collapse:collapse;font-size:19px;background:white;margin-top:20px}.table th,.table td{border:2px solid;padding:12px;text-align:left;line-height:1.4}.table th{background:var(--teal)}.table small{font-size:14px}.row{display:flex;justify-content:space-between;gap:20px;align-items:center;margin:14px 0;padding:15px 20px;background:white;border:2px solid;border-radius:8px;font-size:23px}.timelineLine{border-bottom:5px solid var(--ink);display:flex;justify-content:space-between;padding-bottom:15px;margin:32px 5px 24px;font-size:19px;font-weight:900}.timelineLine .ongoing{background:var(--teal);padding:10px 16px;margin-top:-10px}.options{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 22px}.options button{font-size:18px}.feedback{font-size:18px;padding:16px;border:2px solid;background:#e5f3db;line-height:1.6}.mini{margin:0 0 20px}.mini .prompt{font-size:21px;margin-bottom:10px}.correct{background:#cee8ae!important;opacity:1!important}.wrong{background:#ffd5ca!important;opacity:1!important}.chips{display:flex;flex-wrap:wrap;gap:9px}.chips button{font-size:19px;background:var(--yellow)}.slot{padding:16px;border:2px dashed;min-height:82px;margin-bottom:15px;display:flex;flex-wrap:wrap;gap:9px;background:white}.slot button{background:var(--teal);font-size:19px}.nav{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:24px 0}.nav .counter{font-size:15px;font-weight:800}.nav select{max-width:310px;min-height:44px;border:2px solid;border-radius:5px;padding:6px;background:white}.nav button{background:var(--yellow)}.notes{margin:0 0 30px;padding:17px 20px;background:white;border:2px solid;border-radius:8px;line-height:1.6}.notes summary{font-weight:800;cursor:pointer}.notes p{font-size:15px;margin:13px 0 0}.scores{display:flex;gap:10px;align-items:center;font-size:13px;margin:10px 0 22px;flex-wrap:wrap}.scores button{font-size:12px;min-height:34px;padding:6px 10px}.scores b{padding:5px}.printnote{font-size:12px;text-align:center;margin-bottom:20px}.tiny{font-size:13px}.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.tabs button.active{background:var(--yellow)}@media(max-width:900px){h1{font-size:53px}h2{font-size:39px}.slide{padding:30px;min-height:580px}.timeline{grid-template-columns:1fr 1fr}.cover,.two{grid-template-columns:1fr}.cover img{max-height:280px;object-fit:cover}.nav select{max-width:220px}.table{font-size:16px}.example{font-size:24px}}@media(max-width:550px){header{padding:10px 14px;flex-wrap:wrap}header b{font-size:15px}main{padding:0 12px;margin:15px auto}.slide{padding:25px 20px;min-height:550px}h1{font-size:44px}h2{font-size:33px}p{font-size:18px}.lead{font-size:20px}.formula{font-size:20px}.timeline{grid-template-columns:1fr}.time h3{font-size:20px}.nav{flex-wrap:wrap}.nav select{max-width:100%;width:100%;order:3}.nav .counter{font-size:13px}.table{font-size:13px}.table th,.table td{padding:7px}.example{font-size:21px}.row{font-size:18px;padding:13px}.options button{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media print{header,.nav,.scores,.notes,.printnote,button{display:none!important}body{background:white}.slide{border:0;box-shadow:none;min-height:auto}.hidden{display:block!important}}
</style></head><body><header><b>G! GRAMMAR COMIC CLUB</b><div class="tools"><button id="full">Full screen</button></div></header><main><section id="slide" class="slide" aria-live="polite"></section><nav class="nav" aria-label="Review navigation"><button id="prev">← Back</button><span id="count" class="counter"></span><select id="jump" aria-label="Jump to a review page"></select><button id="next">Next →</button></nav><div class="scores"><b>Optional team points</b><button id="a">Team A +1</button><span id="av">0</span><button id="b">Team B +1</button><span id="bv">0</span><button id="reset">Reset points</button></div><details class="notes"><summary>Teacher notes for this page</summary><p id="teacher"></p></details><p class="printnote">Chapter 2 · Review 1-2 · Offline classroom review · All content and artwork are inside this file · Arrow keys move between pages · Answers reset when you return to a page</p></main><script>

const rev=(label,answer)=>`<div class="reveal"><button class="revealbtn">${label}</button><div class="model hidden">${answer}</div></div>`;
const quiz=(id,prompt,opts,answer,why)=>`<div class="mini" data-answer="${answer}"><p class="prompt">${prompt}</p><div class="options">${opts.map((v,i)=>`<button data-q="${id}" data-i="${i}">${v}</button>`).join('')}</div><div class="feedback hidden">${why}</div></div>`;
const PAGES=[
 {title:'Review 1-2',label:'Chapter 2 · Review 1-2 · Units 3–4',html:`<span class="ribbon">CHAPTER 2</span><h1>Past. Future.<br>Mystery!</h1><p class="lead">What could we do?<br>What will we be able to do?<br>What do the clues tell us?</p><div class="two"><div class="box teal"><h3>Ability</h3><p>could / couldn’t<br>will / won’t be able to</p></div><div class="box purple"><h3>Certainty</h3><p>must / has to / have to<br>might / can’t</p></div></div>`,note:'Review 1-2 covers Units 3–4. Suggested 35–45 min: ability (pages 2–8, 12 min), certainty (9–14, 12 min), correction and use (15–18, 12 min). All examples here are practice scenarios. No listening track or internet is needed.'},
 {title:'Choose the time',label:'Ability · meaning first',html:`<h2>When is the ability?</h2><div class="two"><div class="box teal"><h3>In the past</h3><div class="example">At six, I <b>could swim</b>.</div><p>I had that skill then.</p></div><div class="box yellow"><h3>In the future</h3><div class="example">After more practice, I <b>will be able to dive</b>.</div><p>I expect to have that skill later.</p></div></div><p class="muted">Look for the time context before choosing the form.</p>`,note:'Ask learners to point behind for past and ahead for future. Could can have other meanings, but these tasks clearly specify general past ability.'},
 {title:'Could / couldn’t',label:'Past ability · statements',html:`<h2>One form for every subject.</h2><div class="formula">I / you / he / she / it / we / they<br>+ could / couldn’t + base verb</div><div class="example">She <b>could draw</b> at five.<br>She <b>couldn’t ride</b> a bicycle at four.</div><div class="box coral"><p>“He could to swim.”<br>“She couldn’t rode a bicycle.”</p>${rev('Repair both sentences','He <b>could swim</b>.<br>She <b>couldn’t ride</b> a bicycle.<br>No to or past ending after could.')}</div>`,note:'Have pairs make a positive and a negative with different subjects. Listen for coulds, could to, and couldn’t + past form.'},
 {title:'Could you…?',label:'Past ability · questions',html:`<h2>Move could before the subject.</h2><div class="formula">Could + subject + base verb?</div><div class="example"><b>Could you draw</b> when you were five?<br>Yes, I <b>could</b>. / No, I <b>couldn’t</b>.</div><div class="two"><div class="box teal"><p>They could swim at six.</p>${rev('Make the question','Could they swim at six?')}</div><div class="box yellow"><p>“Did she could play the piano?”</p>${rev('Show the repair','Could she play the piano?<br>Could is already the helper verb. Do not add did.')}</div></div>`,note:'Call questions to the class and require matching short answers. Keep the past-time cue clear so this is not confused with a polite request.'},
 {title:'Will be able to',label:'Future ability · statements',html:`<h2>Keep the whole verb group.</h2><div class="formula">will + be able to + base verb<br>won’t + be able to + base verb</div><div class="example">After more practice, I <b>will be able to play</b> this song.<br>With the gate locked tomorrow, we <b>won’t be able to enter</b>.</div>${rev('Repair “I will can dive.”','I <b>will be able to dive</b>.<br>We do not put will directly before can.')}`,note:'Clap the chunks will / be able to / dive. Contrast an expected future skill with a simple intention to do an action. The target is future ability.'},
 {title:'Will you be able to…?',label:'Future ability · questions',html:`<h2>Will comes first.</h2><div class="formula">Will + subject + be able to + base verb?</div><div class="example"><b>Will she be able to help</b> tomorrow?<br>Yes, she <b>will</b>. / No, she <b>won’t</b>.</div><div class="box purple"><p>Put this into a question:<br>They will be able to finish tomorrow.</p>${rev('Reveal the question','Will they be able to finish tomorrow?')}</div>`,note:'Ask learners to identify which word must stay in the short answer: will. Do not accept Yes, she can as a matching short-answer exercise here, even though it can be meaningful in wider conversation.'},
 {title:'Ability time detective',label:'Choose the form for the stated time',html:`<h2>Read the whole situation.</h2>${quiz('a1','At six, Ruby knew how to swim. Choose a past-ability statement.',['Ruby could swim at six.','Ruby will be able to swim at six.'],0,'Could + base verb describes her ability at that past age.')}${quiz('a2','After training next year, the robot is expected to have a new ability.',['It will be able to climb stairs.','It will can climb stairs.'],0,'Use the complete future-ability group: will be able to.')}${quiz('a3','Could they draw at five? Choose the matching negative short answer.',['No, they didn’t.','No, they couldn’t.'],1,'The short answer matches could: No, they couldn’t.')}`,note:'Ask why before revealing. Distinguish a grammatically formed sentence with a different time from a form error such as will can.'},
 {title:'Ability sentence studio',label:'Tap the words · start with Will',html:`<h2>Build a future-ability question.</h2><p>Start with <b>Will</b>. Ask about next year.</p><div id="builderSlot" class="slot"></div><div id="builderPool" class="chips"></div><div class="options"><button id="buildCheck">Check the question</button><button id="buildReset">Start again</button></div><div id="buildFeedback" class="feedback hidden"></div>`,note:'Target: Will you be able to swim next year? Point to the helper, subject, be able to, base verb and time phrase. Let students fix the sequence after the specific hint.',builder:true},
 {title:'How sure are you?',label:'Modals of certainty',html:`<h2>Read the speaker’s confidence.</h2><div class="row"><span>Sure it is true</span><b>must / has to / have to</b></div><div class="row"><span>Possible, but not sure</span><b>might</b></div><div class="row"><span>Sure it is not true</span><b>can’t / cannot</b></div><p class="lead">The clues support a conclusion.</p><p class="muted">In these tasks, must and has to express deductions, rather than rules or obligations.</p>`,note:'Use a closed box as a classroom prop. Ask for a possible identity first, then reveal a clue that makes one identity certain. Avoid claiming a percentage of certainty.'},
 {title:'Must / has to / have to',label:'A strong positive deduction',html:`<h2>These can express the same confidence.</h2><div class="example">It <b>must be</b> a key.<br>It <b>has to be</b> a key.</div><div class="formula">must + base verb<br>has / have to + base verb</div><div class="two"><div class="box yellow"><p>It / he / she → <b>has to</b><br>They / these / we → <b>have to</b></p></div><div class="box teal"><p>These ___ be the missing keys.</p>${rev('Reveal two possible forms','These <b>must</b> be the missing keys.<br>These <b>have to</b> be the missing keys.<br>Both are strong deductions here.')}</div></div>`,note:'Do not make must and has to compete as if only one can ever be grammatical. The online reporter accepts both when the task allows both.'},
 {title:'Might',label:'A possibility',html:`<h2>I have an idea, but I’m not sure.</h2><div class="formula">might + base verb</div><div class="example">It <b>might be</b> a toy, but I am not sure.<br>The box <b>might contain</b> a game.</div><div class="box purple"><p>“It might to be a ring.”<br>“It might is a toy.”</p>${rev('Show the repairs','It <b>might be</b> a ring.<br>It <b>might be</b> a toy.<br>Use the base verb be, without to.')}</div>`,note:'May and could can also express possibilities in other contexts. Here learners are practicing the named form might; make that constraint explicit.'},
 {title:'Can’t be',label:'A strong negative deduction',html:`<h2>The clues rule out the idea.</h2><div class="example">That <b>can’t be</b> my bag because my bag is green.</div><p>The speaker is sure the idea is not true.</p><div class="two"><div class="box coral"><h3>Deduction</h3><p>That can’t <b>be my bag</b>.</p></div><div class="box teal"><h3>Ability</h3><p>I can’t <b>swim</b>.</p></div></div><p class="muted">The word can’t can have different meanings. Read the context.</p>`,note:'Have learners explain the reason after because. Do not substitute mustn’t for can’t in a negative deduction: mustn’t normally expresses prohibition.'},
 {title:'Give the clue',label:'Claim + because + reason',html:`<h2>Don’t just guess. Explain.</h2><div class="example">It <b>must be</b> my notebook <b>because</b> my name is on the cover.</div><div class="example">It <b>might be</b> a toy, but I need more clues.</div><div class="example">It <b>can’t be</b> a real ancient coin <b>because</b> it is a new plastic model.</div>`,note:'Separate strength of language from strength of evidence. Is the clue enough for must, or should the speaker choose might? All scenarios are explicitly supplied for language practice.'},
 {title:'Clue detective',label:'Choose the speaker’s intended certainty',html:`<h2>How sure is the speaker?</h2>${quiz('c1','The speaker is completely sure it is a key.',['It must be a key.','It might be a key.'],0,'Must be expresses the strong deduction requested here. Has to be could express the same confidence.')}${quiz('c2','The speaker is not sure whether it is a toy.',['It has to be a toy.','It might be a toy.'],1,'Might matches the stated uncertainty.')}${quiz('c3','My bag is green. This bag is red. I am sure it is not mine.',['It can’t be my bag.','It must be my bag.'],0,'The given clue rules out the identity. Use can’t be.')}`,note:'Require a reason for each choice. Do not tell learners that a different modal is always ungrammatical; it may communicate a different level of certainty.'},
 {title:'Comic repair',label:'Use the named form and keep the meaning',html:`<h2>Explain each repair.</h2><div class="two"><div><div class="example">“She could to swim.”</div>${rev('Repair past ability','She <b>could swim</b>.<br>No to after could.')}<div class="example">“I will can help.”</div>${rev('Repair future ability','I <b>will be able to help</b>.')}</div><div><div class="example">“These has to be our keys.”</div>${rev('Repair the strong deduction','These <b>have to be</b> our keys.<br>These is plural.')}<div class="example">“It might is a toy.”</div>${rev('Repair the possibility','It <b>might be</b> a toy.<br>Use the base form be.')}</div></div>`,note:'Ask learners to say the whole corrected sentence, then the rule. Keep corrections specific rather than saying only be careful.'},
 {title:'A mini museum interview',label:'Use the forms in speaking',html:`<h2>Ask about ability.</h2><div class="two"><div class="box teal"><h3>Earlier in your life</h3><p>Could you … when you were …?<br>Yes, I could. / No, I couldn’t.</p></div><div class="box yellow"><h3>A future skill</h3><p>What will you be able to do after more practice?<br>I will be able to …</p></div></div>${rev('Reveal a sample exchange','A: Could you swim when you were four?<br>B: No, I couldn’t.<br>A: What will you be able to do after more practice?<br>B: I will be able to dive.')}`,note:'Two minutes each. Truthful answers are welcome; a child does not have to invent a skill. For future ability, an imagined goal is enough.'},
 {title:'Write your own clues',label:'From rules to your own ideas',html:`<h2>Four sentences. Four meanings.</h2><div class="box purple"><p>1. Something you could or couldn’t do when you were younger.<br>2. A skill you expect to have in the future.<br>3. A strong deduction, with a clue.<br>4. Something that might be true.</p></div>${rev('Reveal one example of each','At five, I <b>could ride</b> a bicycle.<br>After more practice, I <b>will be able to play</b> this song.<br>It <b>must be</b> my notebook because my name is on it.<br>The mystery object <b>might be</b> a toy.')}<p class="muted">Underline the verb groups. Explain why each one fits the meaning.</p>`,note:'Check both form and meaning. In the online writing journal, the checker suggests grammar/spelling fixes; the teacher still checks whether the modal and clue fit the task.'},
 {title:'Review 1-2 exit ticket',label:'Check and wrap up',html:`<h2>Your final five.</h2><p>1. At six, she ___ swim. (past ability: could)</p><p>2. After more practice, I ___ play this song. (future ability)</p><p>3. I am sure it is a ring. It ___ be a ring. (must / has to)</p><p>4. I am not sure. It ___ be a toy. (might)</p><p>5. I am sure it is not my bag. It ___ be my bag. (cannot)</p>${rev('Reveal and review','1. <b>could</b> · could + base verb<br>2. <b>will be able to</b> · keep the full future-ability form<br>3. <b>must / has to</b> · both can express a strong deduction<br>4. <b>might</b> · possible, not sure<br>5. <b>cannot / can’t</b> · strong negative deduction')}<p class="muted">Choose one mistake. Say the corrected sentence and explain the grammar point.</p>`,note:'Collect first answers before revealing. Identify which form needs another example. A useful wrap-up includes the learner’s original answer, the correct form and the reason.'}
];

let page=0,points=[0,0];const slide=document.querySelector('#slide');
function show(n){page=Math.max(0,Math.min(n,PAGES.length-1));const p=PAGES[page];slide.innerHTML=`<div class="kicker">${p.label}</div>${p.html}`;document.querySelector('#teacher').textContent=p.note;document.querySelector('#count').textContent=`${page+1} / ${PAGES.length}`;document.querySelector('#jump').value=String(page);document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===PAGES.length-1;slide.querySelectorAll('.revealbtn').forEach(b=>b.onclick=()=>{const x=b.nextElementSibling;x.classList.toggle('hidden');b.setAttribute('aria-expanded',String(!x.classList.contains('hidden')));});slide.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const group=b.closest('.mini'),answer=Number(group.dataset.answer);group.querySelectorAll('button').forEach(x=>{x.disabled=true;if(Number(x.dataset.i)===answer)x.classList.add('correct');});if(Number(b.dataset.i)!==answer)b.classList.add('wrong');group.querySelector('.feedback').classList.remove('hidden');});if(p.builder)initBuilder();window.scrollTo(0,0);}
const j=document.querySelector('#jump');j.innerHTML=PAGES.map((p,i)=>`<option value="${i}">${i+1}. ${p.title}</option>`).join('');j.onchange=()=>show(Number(j.value));document.querySelector('#prev').onclick=()=>show(page-1);document.querySelector('#next').onclick=()=>show(page+1);document.querySelector('#full').onclick=()=>{try{if(document.fullscreenElement){document.exitFullscreen?.();}else{const p=document.documentElement.requestFullscreen?.();p?.catch(()=>alert('Full screen is not available. You can still use the review normally.'));}}catch(e){alert('Full screen is not available in this browser.');}};document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();show(page+1);}if(e.key==='ArrowLeft'){e.preventDefault();show(page-1);}});document.querySelector('#a').onclick=()=>document.querySelector('#av').textContent=++points[0];document.querySelector('#b').onclick=()=>document.querySelector('#bv').textContent=++points[1];document.querySelector('#reset').onclick=()=>{points=[0,0];document.querySelector('#av').textContent=0;document.querySelector('#bv').textContent=0;};
function initBuilder(){const words=['able','Will','next','swim','you','to','year?','be'];let selected=[];function draw(){document.querySelector('#builderSlot').innerHTML=selected.map(i=>`<button data-remove="${i}">${words[i]}</button>`).join('');document.querySelector('#builderPool').innerHTML=words.map((w,i)=>selected.includes(i)?'':`<button data-add="${i}">${w}</button>`).join('');slide.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{selected.push(Number(b.dataset.add));draw();});slide.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected=selected.filter(i=>i!==Number(b.dataset.remove));draw();});document.querySelector('#buildFeedback').classList.add('hidden');}draw();document.querySelector('#buildReset').onclick=()=>{selected=[];draw();};document.querySelector('#buildCheck').onclick=()=>{const correct=selected.map(i=>words[i]).join(' ')==='Will you be able to swim next year?';const f=document.querySelector('#buildFeedback');f.classList.remove('hidden');f.textContent=correct?'Exactly! Will + you + be able to + base verb + time phrase.':'Start with Will, then the subject you. Keep be able to together, then add the base verb swim and the time phrase next year.';};}
show(0);
</script></body></html>
